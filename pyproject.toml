    [project]
    authors = [
      {name = "Alonso Fernández Villanueva Meda", email = "alonsofe@chalmers.se"}
    ]
    name = "Pattern-formation-in-a-phytoplankton-population-based-on-stochastic-models-of-the-ocean-turbulence"
    version = "0.1.0"
    description = "Code used in the masters thesis project"
    readme = "README.md"
    requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

    [tool.ruff]
    line-length = 88
    indent-width = 4
    
    [tool.ruff.lint]
    extend-select = ["A", "COM", "C4", "ICN", "PIE", "SIM", "I", "NPY", "N", "PERF", "D"]
